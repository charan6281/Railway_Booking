<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin | RailConnect</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="/css/style.css"></head><body><div class="container py-5"><a href="/" class="brand">🚆 RailConnect</a><h2 class="mt-4">Administrator dashboard</h2><div id="adminLoginBox" class="auth-card"><p class="muted">Demo admin credentials are printed after seeding. Change them in your .env file.</p><form id="adminLoginForm"><input class="form-control mb-2" name="email" type="email" placeholder="Admin email" required><input class="form-control mb-2" name="password" type="password" placeholder="Password" required><button class="btn btn-primary">Admin login</button></form></div><div id="adminPanel" hidden><div class="d-flex justify-content-between my-3"><h4>Train management</h4><button class="btn btn-outline-primary" id="refreshAdmin">Refresh data</button></div><div id="adminStats"></div><div id="adminTrains"></div><h4 class="mt-4">Add train</h4><form id="addTrainForm" class="panel row g-2"><input class="form-control col" name="number" placeholder="Train number" required><input class="form-control col" name="name" placeholder="Train name" required><select class="form-select col" name="source" id="adminSource"></select><select class="form-select col" name="destination" id="adminDestination"></select><input class="form-control col" name="departureTime" placeholder="Departure HH:MM" required><input class="form-control col" name="arrivalTime" placeholder="Arrival HH:MM" required><input class="form-control col" name="duration" placeholder="Duration e.g. 8h 30m" required><button class="btn btn-primary">Add train</button></form><h4 class="mt-4">All reservations</h4><div id="adminBookings"></div></div></div><script src="/js/app.js"></script></body></html>
